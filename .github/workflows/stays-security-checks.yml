name: Uttarkunth Stays security checks

on:
  push:
    branches:
      - security/stays-role-hardening
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'netlify/functions/**'
      - 'tests/stays-security.test.mjs'
      - 'package.json'
      - 'vite.config.ts'
      - '.github/workflows/stays-security-checks.yml'

permissions:
  contents: read

concurrency:
  group: stays-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-contract-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run security contract tests
        run: npm run test:security
      - name: Build site
        run: npm run build
